
name: Metrics

on:
  # Daily scheduled update (UTC)
  schedule:
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Re-run when pushing to default branches
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    # Minimum required permission to commit the SVG
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@v3.34
        with:
          # Personal Access Token (classic)
          token: ${{ secrets.METRICS_TOKEN }}

          # GitHub identity
          user: Argon360

          # Output configuration (CRITICAL FIX)
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore(metrics): update github-metrics.svg"

          # Template & base sections
          template: classic
          base: header, activity, community, repositories, metadata

          # Timezone
          config_timezone: UTC

          # Plugins
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_ignored: html, css

          plugin_stars: yes
          plugin_traffic: yes
