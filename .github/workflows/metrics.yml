name: Metrics

on:
  # Daily scheduled run (UTC)
  schedule:
    - cron: "0 0 * * *"

  # Manual trigger
  workflow_dispatch:

  # Re-run on pushes to default branches
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    # Minimal permissions required to commit the SVG
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Identity
          user: Argon360
          template: classic
          config_timezone: UTC

          # Base sections
          base: header, activity, community, repositories, metadata

          # Plugins
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_ignored: html, css

          plugin_stars: yes
          plugin_traffic: yes
