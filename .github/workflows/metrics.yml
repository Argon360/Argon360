name: Metrics

on:
  # Schedule updates every 4 hours
  schedule:
    - cron: "0 */4 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Re-run when pushing to default branches
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    # Minimum required permission to commit the SVG
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Personal Access Token (classic)
          token: ${{ secrets.METRICS_TOKEN }}

          # GitHub identity
          user: Argon360

          # Output configuration
          filename: github-metrics.svg
          output_action: none 

          # Template & base sections
          template: classic
          base: header, activity, community, repositories, metadata

          # Timezone
          config_timezone: UTC

          # Plugins
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_ignored: html, css

          plugin_stars: yes

      - name: Commit and Push Metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git commit -m "chore(metrics): update github-metrics.svg" || echo "No changes to commit"
          git push
